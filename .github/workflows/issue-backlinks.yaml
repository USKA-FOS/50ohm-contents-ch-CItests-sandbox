name: Add backlinks to new review issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  comment:
    runs-on: ubuntu-latest

    steps:
      - name: Extract IDENT from issue title
        id: extract
        shell: bash
        run: |
          title="${{ github.event.issue.title }}"

          if [[ "$title" =~ ^\[Review-Feedback\]\ ([A-Za-z0-9_-]+)\.md(:.*)?$ ]]; then
            ident="${BASH_REMATCH[1]}"
            printf 'ident=%s\n' "$ident" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment on issue
        if: steps.extract.outputs.ident != ''
        env:
          GH_TOKEN: ${{ github.token }}
          IDENT: ${{ steps.extract.outputs.ident }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --body "Backlink to page provided by automatic GitHub action script:
https://50ohm.uska.ch/50ohm_review_de/NE_${IDENT}.html"
